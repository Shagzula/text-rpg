# NPC persona template (AGREED, matches contracts.md v0.10 §d; Nov 10, 2026 CST). Setting-neutral placeholder: rename when the setting is chosen.
# Schema: content/npc_persona_schema.md. The engine loads this file. Only PUBLIC parts reach the voice prompt
# (name, voice, traits, goals), plus the topic texts the engine allows on a given turn.
# `secrets` and `insight_tell` are never sent to the voice prompt or the narrator, except as engine-approved text.
# A secret's LABEL is visible in context topics once the band reaches its min_band (a hint that he knows something);
# its TEXT only once the engine reveals it. The engine's demo personas (code/rpg/data/npcs/) use the same shape.

key: npc_example_gatekeeper
name: Gatekeeper
description: "A tired gate warden in a patched coat, ledger under one arm."   # -> npcs.description
article: the                 # optional ("" | the | a | an): "Gatekeeper" is a role, so narrate "the Gatekeeper", not bare "Gatekeeper"
dark_sound: "the scratch of a pen and a tired sigh"   # optional: all the player gets of him in the dark (never his name)

voice:
  style: "Clipped and formal. Short sentences. Calls everyone 'traveller'. Sighs before bad news. Never swears."
  sample_phrases:
    - "Gate's shut at dusk, traveller. Rules are rules."
    - "Write your name. Legibly."
    - "I've heard that one before."

traits: [dutiful, tired, suspicious_of_strangers, soft_spot_for_children]   # -> npcs.traits
goals:                       # public motivations (no hidden info here; put that in secrets)
  - "Keep the gate ledger in order and avoid trouble with superiors."
  - "Get through the night shift without incident."

base_disposition: -5         # -> npcs.disposition at seed (-100..100). -5 = neutral band

combat:                      # optional; read once at seed into npcs columns (defense, HP, attack, damage, save)
  defense_dc: 12
  max_hp: 8
  attack_bonus: 3
  damage: "1d6"
  save_bonus: 1

gifts:                       # optional, engine-only: item template key -> disposition gain (1..50). No friendly cap:
                             # gifts (and story events) are the only ways to allied. Defaults: an unlisted item worth
                             # 50+ coins gives +10; each template works once per NPC; items he trades away are refused.
  item_bracing_tonic: 20     # a long night shift: he'd treasure something to keep him going
  item_light_source: 10      # a torch for the dark end of the gate (worth < 50, so only valued because listed)

social:                      # NPC social DC = base + per-skill modifier
  base_dc: 12
  persuasion: 0
  deception: 2               # suspicious: harder to lie to
  intimidation: 4            # dutiful: hard to scare
  insight: -2                # easy to read when tired

insight_tell: "Keeps glancing at the ledger whenever the night patrol is mentioned. Something about it worries him."

knowledge:                   # public topics: key -> label + text (the label is what the interpreter matches)
  gate_rules:
    label: "gate rules / opening hours / getting in"
    text: "The gate closes at dusk and opens at dawn. After dark, only those in the ledger may pass."
    aliases: [the gate, gate, gate rules, closing time, when the gate closes, when the gate opens]
  the_road_beyond:
    label: "the road beyond the gate"
    text: "The road beyond forks after an hour's walk. The left fork is safer but longer."
    aliases: [the road, road, the fork, the road ahead]
  missing_patrol:
    label: "the missing night patrol"
    text: "Two of the night patrol didn't report back last night. Last seen heading toward the old cellar."
    aliases: [the patrol, patrol, night patrol, the night patrol]
  gatekeeper_self:
    label: "the gatekeeper himself / his name / his work"
    text: "He has kept this gate for eleven years and would like to retire somewhere quiet."
    aliases: [yourself, you, your name, your work, the gatekeeper]

secrets:                     # never revealed below min_band; min_band 'never' = never revealed at all
  side_entrance:
    label: "a way in besides the gate"
    text: "A drainage grate behind the stables is loose and leads inside the walls."
    min_band: allied
    aliases: [side entrance, the drainage grate, grate]   # secret aliases are listed only once the secret is visible
  ledger_bribe:
    label: "the ledger being for sale"
    text: "For the right favour he will write a name into the ledger after hours."
    min_band: friendly
    aliases: [the ledger, ledger, a name in the ledger]
  true_fear:
    label: "who he really answers to"
    text: "He suspects his superior arranged the patrol's disappearance."
    min_band: never           # world fact only; the story reveals it some other way

reveal_by_band:              # CUMULATIVE: each band also includes everything listed at the bands below it
  hostile:    {topics: [], trades: []}
  unfriendly: {topics: [gate_rules], trades: []}
  neutral:    {topics: [the_road_beyond, gatekeeper_self], trades: [trade_whistle_for_rations, trade_buy_rations, trade_sell_rope]}
  friendly:   {topics: [missing_patrol, ledger_bribe], trades: [trade_antidote_for_tonic]}
  allied:     {topics: [side_entrance], trades: []}

trades:                      # entries: {item: <template key>, qty: N, name?: display name (gives only, no digits)} or {gold: N}
                             # gives = what HE hands over. Coin entries are band-priced by the engine (pay x1.5 hostile ..
                             # x0.75 allied, round up; receive x0.5 .. x1.25, round down). Item entries are never scaled.
                             # repeatable: true = can be done again, up to 10 at once (action `quantity` 1-10);
                             # default false = one-time (quantity must be 1; once done it stays listed with done: true).
                             # aliases (optional, on topics, secrets and trades): exact phrases the interpreter may match.
  trade_whistle_for_rations:  # item-for-item, one-time
    label: "his spare signal whistle"
    aliases: [whistle, spare whistle, the whistle]
    gives: [{item: item_signal_whistle, qty: 1}]
    wants: [{item: item_rations, qty: 1}]
  trade_buy_rations:         # coin purchase, repeatable (1-10 per request via the action's quantity), display name
    label: "a day's rations from the gate canteen"
    aliases: [rations, ration, food, canteen rations]
    gives: [{item: item_rations, qty: 1, name: "Canteen Rations"}]
    wants: [{gold: 6}]
    repeatable: true
  trade_sell_rope:           # he buys from the player, one-time
    label: "buying a coil of rope for the watch"
    aliases: [rope, my rope, sell rope]
    gives: [{gold: 8}]
    wants: [{item: item_rope, qty: 1}]
  trade_antidote_for_tonic:
    label: "an antidote vial from the guard stores"
    aliases: [antidote, antidote vial]
    gives: [{item: item_antidote, qty: 1}]
    wants: [{item: item_bracing_tonic, qty: 1}]
