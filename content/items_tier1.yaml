# Tier-1 Item Templates (v0.9, Nov 10, 2026 CST)
# Setting-neutral placeholder names: rename once Dan picks a setting. Item NAMES contain no digits;
# quantities live in stats (quantity, length_ft, days...).
# Mechanics follow D&D 5e baselines (DESIGN.md: 5e abilities/skills/proficiency).
# Shape AGREED (matches contracts.md v0.10), see schemas_proposed.md section c. All templates load via rpg.db.add_item_template().
# Engine-read stats keys (v0.7): damage, properties, range, proficiency, improvised_damage, effect, amount, condition,
#   uses, check {skill, est_difficulty}, dc, use_sets_flag, base_ac, dex_cap, ac_bonus, enables, skill_bonus {skill, grants},
#   duration, save {ability, est_difficulty}, condition_effect, condition_name, subcategory (climbing, signal), perk.
#   `effect` is an engine enum: heal | cure_condition | buff | condition | light | sustenance.
#   Descriptive-only text lives in `use_note`, `buff`, `side_effect` (shown as prose, no mechanics).
#   condition_effect shapes: player buff -> {advantage: [...], disadvantage: [...], expires_after_check: [...]}
#     (effects.BUFF_EFFECTS shape); NPC condition (flash powder) -> {no_attack: true} (npc_conditions.effect shape).
#   Durations: "N round(s)" = N turns, "N minute(s)" = N turns, "N hour(s)" = 60N turns (1 turn ~ 1 minute).
#
# IMPROVISED LOCKPICKING (Lead decision; implemented in contracts.md v0.5, actions.IMPROVISED_PICK_TAG):
#   - Real lock tool (stats.enables: [pick_lock], e.g. item_lockpicks): normal DC (authored unlock_dc or hint).
#   - No lock tool, but holding an item tagged `improvised_pick` (item_knife; future wire/pin items):
#     pick_lock allowed at DC very_hard (25), or the authored DC if higher. The held item is used
#     automatically (added to the result's items_used).
#   - Neither: rejected impossible_action / needs_tool.
# STRUCTURED PERKS (v0.7; these fields equal the engine defaults exactly, so the YAML is the source of truth):
#   - stats.enables / stats.skill_bonus on climbing items (item_rope): override inventory.SUBCATEGORY_DEFAULTS.
#   - stats.perk on equipment (item_leather_cap, item_work_gloves): overrides effects.EQUIP_PERKS. Equipped only.
#     Shapes: {negate_conditions: [...], per: rest} | {advantage_tags: [...], advantage_methods: [...]}.
#   - stats.noise on noise makers (item_signal_whistle): {distract: next_attack, once_per_foe: true, heard_range: room|adjacent}
#     overrides effects.DEFAULT_NOISE (v0.7.1); equal to it here (adjacent = heard here and one exit away).
#   - item_travel_boots: no perk (cosmetic).
# Item names contain no digits (load-time check since v0.5). Trade display names (persona `gives[].name`) too.

# Field layout (Engine Coder decision):
#   Top-level columns: id, name, category, power_tier, slot, value, weight, tags, notes (-> description)
#   Everything else, including subcategory, lives in `stats` (JSON column).
#   Categories: weapon | armor | shield | ammo | consumable | tool | utility | misc
#   ids: item_<slug>. Inventory keys in the LLM context use the same slug style.
#
# Units / conventions:
#   value  = base currency units, 1 unit ~ a 5e silver piece (10 units ~ 1 gp).
#   weight = lb-equivalent.
#   slot   = main_hand | off_hand | two_hands | body | head | hands | feet | belt | none
#   damage = 5e dice strings. Engine adds the ability modifier (STR, or DEX for finesse/ranged) + proficiency on the attack check.
#   Tier 1 = what a starting character finds or buys in the hub town and first dungeon. No magic bonuses (+1) at tier 1.
#   Slice house rules (KEPT per Lead): only body armor sets base AC. head/hands/feet pieces give minor perks.
#     Buckler +1 AC. Heavy two-hander gives disadvantage at STR < 13. Bracing Tonic.
#
# Scarcity (Lead decision):
#   Every item has two tags: rarity_<common|uncommon|rare> and avail_<shop|limited_stock|loot_only>.
#     shop          = always buyable in the hub town
#     limited_stock = shop carries 0-1 at a time, or quest/dungeon placement
#     loot_only     = never sold at tier 1. Strong-enemy drops or a quest reward.
#   Suggested starting purse: 60 units (enough for a little basic gear, e.g. rope + light + rations + bandages).
#   Suggested premade starting kit (placeholder until the setting/character is chosen):
#     item_short_blade (equipped), item_leather_armor (equipped), item_travel_boots (equipped),
#     item_healing_draught x1, item_light_source x2, item_rations x2, 60 units.

